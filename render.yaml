services:
  - type: web
    name: watchparty
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://watchparty.onrender.com
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
