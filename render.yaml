services:
  - type: web
    name: watchparty
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        fromService:
          name: watchparty
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: watchparty-db
          property: connectionString

databases:
  - name: watchparty-db
    databaseName: watchparty
    user: watchparty
    plan: free
    region: oregon
