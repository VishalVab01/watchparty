services:
  - type: web
    name: watchparty
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://watchparty.onrender.com
      - key: DATABASE_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: watchparty-db
          property: connectionString

databases:
  - name: watchparty-db
    databaseName: watchparty
    user: watchparty
    plan: free
    region: oregon
